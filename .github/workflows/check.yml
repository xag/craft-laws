# Every check this repo keeps runs through one command, `python -m craft.gate`: the checks run
# side by side and the command returns when the last one ends. The list lives in
# craft/gate.py, so the machine where the work is done runs exactly what CI runs - a step
# added here instead would run only after a push.
#
# NO CREDENTIAL IS NEEDED. `.quern/library` is committed, so the pinned bytes travel with the
# lock that names them. CRAFT_CLIENT_NAMES comes from the repository's variables.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  laws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # craft.report diffs HEAD against its parent
      - uses: astral-sh/setup-uv@v5
      - name: Every check, in parallel
        env:
          CRAFT_CLIENT_NAMES: ${{ vars.CRAFT_CLIENT_NAMES }}
        run: uv run python -m craft.gate
