[project]
name = "craft-laws"
version = "0.1.0"
description = "craft@0.1.0 — the laws of interface and copy, as checkable data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["quern", "lark>=1.2", "z3-solver>=4.13"]

# The tray icon only; the checker itself stays stdlib, so a machine that never
# wants an icon installs nothing extra.
[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
craft-account-tray = "craft.account_tray:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv.sources]
# Pinned by rev, always. quern is pre-1.0 and its own doctrine is fork-or-republish over resolver
# algebra. This package builds ON quern's ledger and grounding packages; it does not live inside
# them, and that is the point (see craft/package.py, and xag/quern#19).
quern = { git = "https://github.com/xag/quern", rev = "ab9563e" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["craft"]


# The ledger lives beside the code, not under ledger/: `quern brief` needs to be told
# once, here, rather than by every reader passing --module.
[tool.quern]
ledger = "craft/tree.py:build"
