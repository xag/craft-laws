[project]
name = "craft-laws"
version = "0.1.0"
description = "craft@0.1.0 — the laws of interface and copy, as checkable data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quern",
    "lark>=1.2",
    "z3-solver>=4.13",
    "jsonschema>=4.21",
    "xag-flight-recorder",
    "courier",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

# The tray icon only; the checker itself needs no GUI dependency.
[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
craft-review-tray = "craft.review_tray:main"

[tool.uv.sources]
# Pinned by rev, always. quern is pre-1.0 and its own doctrine is fork-or-republish over resolver
# algebra. This package builds ON quern's ledger and grounding packages; it does not live inside
# them, and that is the point (see craft/package.py, and xag/quern#19).
quern = { git = "https://github.com/xag/quern", rev = "e420ecd4fc7f453510cd58eda51813c7be324298" }
# The rev quern itself pins, stated as our own dependency because craft.flight imports it —
# leaning on a transitive pin is how an import breaks on somebody else's upgrade.
xag-flight-recorder = { git = "https://github.com/xag/flight-recorder", rev = "4d24784d9e6b7da1cb8c741984b0261fe096b9e7" }
# Pinned by rev like the others: a path to a sibling checkout installs on one machine
# and on no runner (CI died at `uv sync` on it, 2026-09-02).
courier = { git = "https://github.com/xag/courier", rev = "b8125cc" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["craft"]


# The ledger lives beside the code, not under ledger/: `quern brief` needs to be told
# once, here, rather than by every reader passing --module.
[tool.quern]
ledger = "craft/tree.py:build"
