# Two assertions, both about drift — the failure mode this repo exists to prevent.
#
# The check is red today, on purpose: the uncited laws named below cite nobody and the
# publish gate refuses them. So CI does not ask "is it green" — it asserts the red is
# EXACTLY the declared red (a set of names, never a count — see counts-are-computed).
# A law that quietly loses a citation, or a gate that quietly goes green, both change the
# set, and both should cost a failing build until the record moves with them.
#
# The second assertion: LAWS.md is a rendered view, and a view that can drift from its
# data is a second source of truth. CI re-renders and diffs, ignoring only the rev stamp.
#
# NEITHER NEEDS A CREDENTIAL ANY MORE. This job used to check out xag/quern-registry with
# ESTATE_READ_TOKEN and rewrite git's URLs to carry it. Both halves were removable: quern is
# public now, and the registry checkout was fetching a package this repo already pins — from a
# registry frozen at ledger@0.4.1, which is why the check died on "craft@0.1.1 (pinned) is not
# in the library". `.quern/library` is committed, so the pinned bytes travel with the lock that
# names them. Verified with QUERN_REGISTRY pointed at a path that does not exist.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  laws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The red is exactly the declared red
        run: |
          uv run python - <<'EOF'
          from quern import run_rules
          from craft.tree import build
          red = {r.node for r in run_rules(build()) if not r.ok}
          declared = {"no-calque", "untranslatable-tone",
                      "empty-state-never-contradicts", "counts-are-computed",
                      "internal-references-resolve", "publish"}
          assert red == declared, (
              f"the red set changed: {sorted(red)} != {sorted(declared)} - a law lost or "
              "gained a citation without the record moving. Update laws.py AND this list "
              "in the same commit, deliberately.")
          print(f"red is exactly the declared red: {sorted(red)}")
          EOF
      # The prose deciders, on the front page that earned them. docs/ still holds
      # standing findings — visible debt, run `python -m craft.prose docs/*.md` to
      # see it — but the front page stays green or the build says so.
      - name: The README passes its own laws
        run: uv run python -m craft.prose --terms twin,drawing,walk,decider,critic,witness README.md
      - name: LAWS.md is the data, rendered
        run: |
          uv run python -m craft.render > /tmp/laws.md
          diff <(grep -v 'GENERATED from craft@' LAWS.md) \
               <(grep -v 'GENERATED from craft@' /tmp/laws.md) \
            || { echo "LAWS.md disagrees with the data - re-render: python -m craft.render > LAWS.md"; exit 1; }
